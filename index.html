<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Control de Primas y Gastos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>Control de Primas</h1>
    <div>
      <label for="month-select">Mes:</label>
      <select id="month-select"></select>
      <button id="save-month">Guardar Mes</button>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Primas del mes</h2>
      <button id="add-bonus">Agregar Prima</button>
      <section class="card">
  <h2>Primas del mes</h2>
  <button id="add-bonus">Agregar Prima</button>

  <div style="overflow-x:auto;">
    <table id="bonus-table">
      <thead>
        <tr>
          <th>Prima</th>
          <th>Valor</th>
          <th>Gastos</th>
          <th>Saldo</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="bonus-tbody"></tbody>
    </table>
  </div>

  <p>Total primas del mes: <span id="bonus-total"></span></p>
</section>

<!-- Debajo de la tabla, lista de gastos de la prima seleccionada -->
<section class="card">
  <h2>Gastos de la prima seleccionada</h2>
  <p id="selected-bonus-title">Ninguna prima seleccionada</p>
  <button id="add-expense" disabled>Agregar gasto</button>
  <div style="overflow-x:auto;">
    <table id="expense-table">
      <thead>
        <tr>
          <th>Gasto</th>
          <th>Monto</th>
          <th>Fecha</th>
          <th>Descripción</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="expense-tbody"></tbody>
    </table>
  </div>
</section>

      <p>Total primas: <span id="bonus-total"></span></p>
    </section>

    <section class="card">
      <h2>Resumen gráfico del mes</h2>
      <vas id="summaryChart" width="360" height=""360"></canvas>
    </section>
  </main>

  <!-- Modal Prima -->
  <dialog id="bonusDialog">
    <form id="bonusForm" method="dialog">
      <h3>Prima</h3>
      <label>
        Nombre
        <input id="bonusName" required />
      </label>
      <label>
        Valor prima
        <input id="bonusAmount" type="number" min="1" required />
      </label>
      <label>
        Fecha de pago
        <input id="bonusDate" type="date" />
      </label>
      <label>
        Descripción
        <textarea id="bonusDescription" rows="2"></textarea>
      </label>
      <menu>
        <button type="button" id="btnBonusCancel">Cancelar</button>
        <button type="submit" id="btnBonusSave">Guardar</button>
      </menu>
    </form>
  </dialog>

  <!-- Modal Gasto de una prima -->
  <dialog id="expenseDialog">
    <form id="expenseForm" method="dialog">
      <h3>Gasto de prima</h3>
      <label>
        Nombre del gasto
        <input id="expName" required />
      </label>
      <label>
        Monto
        <input id="expAmount" type="number" min="1" required />
      </label>
      <label>
        Fecha
        <input id="expDate" type="date" />
      </label>
      <label>
        Descripción
        <textarea id="expDescription" rows="2"></textarea>
      </label>
      <menu>
        <button type="button" id="btnExpCancel">Cancelar</button>
        <button type="submit" id="btnExpSave">Guardar</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
